name: Question or problem
description: Something did not run, or is not clear.
title: "[question] "
labels: ["question"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, error, and what you expected instead.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: e.g. A100 40GB, torch 2.8, transformers 5.14
