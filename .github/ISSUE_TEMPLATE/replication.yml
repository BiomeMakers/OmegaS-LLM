name: Replication report
description: You ran check_M.py on your own model. Tell us what came out, including if it came out against us.
title: "[replication] "
labels: ["replication"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running it. **A result that goes against ours is more useful to us
        than one that confirms it**, and we would rather hear about it: we have run
        this on one model, which is not enough to know whether the reduction to
        degree variance is general or specific to what we measured.

        Nothing here is required except the model name. Fill in what you have.

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. Qwen2.5-7B, Mistral-7B, your own checkpoint
    validations:
      required: true

  - type: dropdown
    id: verdict
    attributes:
      label: What the script printed at the end
      options:
        - C and M are inert (reproduces our finding)
        - The factors respond, but an order of magnitude less than Coex
        - The factors are live, comparably to Coex (does not reproduce)
        - It did not run
    validations:
      required: true

  - type: textarea
    id: numbers
    attributes:
      label: The four medians
      description: >
        Paste the "median" lines the script prints, or attach the check_M.json
        file it writes, which is better because it carries the per-module rows.
      render: shell

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: >
        Whether it varied with depth, whether square and non-square modules
        behaved differently, anything that surprised you, or anything about the
        checkpoint we would not guess.
